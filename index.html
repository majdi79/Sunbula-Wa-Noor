
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام سنبلة ونور - متابعة الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              tajawal: ['Tajawal', 'sans-serif'],
              amiri: ['Amiri', 'serif'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
      }
      .quran-font {
        font-family: 'Amiri', serif;
      }
      
      /* Smooth transitions for theme switching and interactions */
      * {
        transition-property: background-color, border-color, color, fill, stroke, transform;
        transition-duration: 200ms;
      }

      .card-tilt {
        transition: transform 0.1s ease-out;
        transform-style: preserve-3d;
        perspective: 1000px;
      }

      .spotlight {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          circle at var(--x) var(--y),
          rgba(16, 185, 129, 0.15) 0%,
          transparent 80%
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card-inner:hover .spotlight {
        opacity: 1;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #1e293b;
      }
    </style>
